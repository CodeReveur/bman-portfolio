<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Higher 3D Drop Shadow (Elevated float above page) -->
    <filter id="shadowPointer3d" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4.5" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Cyan Luminous Energy Core Glow -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.75" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lit Facet with Quantum Cyan/Ice Blue tint -->
    <linearGradient id="pLitFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0fdf4"/>
      <stop offset="65%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Shaded Right Facet with Deep Space Cyan tint -->
    <linearGradient id="pShadeFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="85%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- 3D Extrusion Side Wall Gradient -->
    <linearGradient id="pExtrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadowPointer3d)">
    <!-- 3D Extrusion Slab (Volumetric depth walls) -->
    <path d="M3 23.5 L5.5 26 L15 28.5 L18 26 L15 19 L21 17.5 L3 2 Z" fill="url(#pExtrude)" stroke="#020617" stroke-width="0.5"/>
    <path d="M10.5 19.5 L13 28 L18 25.5 L15 18 Z" fill="#020617"/>

    <!-- Main 3D Top Surface -->
    <polygon points="3,2 19,15.5 9,17" fill="url(#pShadeFacet)" stroke="#0369a1" stroke-width="0.4"/>
    <polygon points="3,2 3,22.5 9,17" fill="url(#pLitFacet)" stroke="#bae6fd" stroke-width="0.4"/>

    <!-- Tail Stem Facets -->
    <polygon points="9,17 16.5,23.5 13.5,16" fill="#082f49" stroke="#020617" stroke-width="0.4"/>
    <polygon points="9,17 13,25.5 16.5,23.5" fill="#0284c7" stroke="#38bdf8" stroke-width="0.4"/>

    <!-- Luminous Cyan 3D Spine Energy Core -->
    <g filter="url(#cyanGlow)">
      <line x1="3" y1="2" x2="9" y2="17" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="9" y1="17" x2="14.5" y2="24.5" stroke="#38bdf8" stroke-width="0.9" stroke-linecap="round"/>
      <line x1="3" y1="2" x2="9" y2="17" stroke="#ffffff" stroke-width="0.65" stroke-linecap="round"/>
    </g>

    <!-- Brilliant Apex Glint -->
    <circle cx="3" cy="2" r="1.0" fill="#ffffff" filter="url(#cyanGlow)"/>
  </g>
</svg>
