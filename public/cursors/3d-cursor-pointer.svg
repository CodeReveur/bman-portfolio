<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Hyper-Chroma Animated Shift for Interactive Mode -->
    <style>
      @keyframes hyperChromaShift {
        0% { stop-color: #00ffff; }
        20% { stop-color: #00ff88; }
        40% { stop-color: #ffb703; }
        60% { stop-color: #ff007f; }
        80% { stop-color: #a855f7; }
        100% { stop-color: #00ffff; }
      }
      @keyframes hyperChromaShift2 {
        0% { stop-color: #ff007f; }
        20% { stop-color: #a855f7; }
        40% { stop-color: #00ffff; }
        60% { stop-color: #00ff88; }
        80% { stop-color: #ffb703; }
        100% { stop-color: #ff007f; }
      }
      .hyper-stop-1 { animation: hyperChromaShift 2.5s linear infinite; }
      .hyper-stop-2 { animation: hyperChromaShift2 2.5s linear infinite; }
    </style>

    <!-- Elevated 3D Physical Shadow -->
    <filter id="pShadow3d" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="3" dy="4.8" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Hyper-Charged Gaming Mouse RGB Underglow -->
    <filter id="hyperUnderglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.0" result="glow"/>
    </filter>

    <!-- Hyper-Laser Spine Glow -->
    <filter id="hyperSpineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Interactive Hyper Gaming Chroma (Lit Facet) -->
    <linearGradient id="pGamingLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#00ffff" class="hyper-stop-1"/>
      <stop offset="45%" stop-color="#00ff88"/>
      <stop offset="75%" stop-color="#ff007f" class="hyper-stop-2"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <!-- Interactive Hyper Gaming Chroma (Shaded Facet) -->
    <linearGradient id="pGamingShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" class="hyper-stop-1"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="75%" stop-color="#be185d" class="hyper-stop-2"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Tail Facet -->
    <linearGradient id="pGamingTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" class="hyper-stop-2"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <!-- Extrusion Wall -->
    <linearGradient id="pExtrudeWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- 1. Hyper-Charged Surface RGB Underglow -->
  <g filter="url(#hyperUnderglow)" opacity="0.95">
    <path d="M4 4 L19 16 L14 18 L16 24 L13 26 L9 18 L4 23 Z" fill="url(#pGamingLit)" transform="translate(2, 3.5)"/>
  </g>

  <!-- 2. Main 3D Elevated Gaming Chassis with Depth Shadow -->
  <g filter="url(#pShadow3d)">
    <!-- 3D Beveled Extrusion Depth Walls -->
    <path d="M3 23 L5.5 26 L15 28.5 L18 26 L15 19 L21 17.5 L3 2 Z" fill="url(#pExtrudeWall)" stroke="#00ffff" stroke-width="0.3"/>
    <path d="M10.5 19.5 L13 28 L18 25.5 L15 18 Z" fill="#000000"/>

    <!-- Bottom RGB Neon Trim -->
    <path d="M4.5 24.5 L13.5 27.5 L17 25.5" stroke="url(#pGamingLit)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- 3. Primary 3D Facets - Hyper Gaming Mouse Chroma Shell -->
    <!-- Right Shaded 3D Facet -->
    <polygon points="3,2 18.5,15.5 9,17" fill="url(#pGamingShade)" stroke="#020617" stroke-width="0.4"/>

    <!-- Left Lit 3D Facet -->
    <polygon points="3,2 3,22.5 9,17" fill="url(#pGamingLit)" stroke="#00ffff" stroke-width="0.4"/>

    <!-- Tail Stem Right Facet -->
    <polygon points="9,17 16,23.5 13,16" fill="#020617" stroke="#0f172a" stroke-width="0.4"/>

    <!-- Tail Stem Left Facet -->
    <polygon points="9,17 12.5,25 16,23.5" fill="url(#pGamingTail)" stroke="#ff007f" stroke-width="0.4"/>

    <!-- Overclocked Perimeter RGB Piping -->
    <path d="M3 2.5 L3 22" stroke="#00ffff" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M3.5 2.5 L18 15" stroke="url(#pGamingLit)" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Hyper-Chroma Dual Spine Laser Strip -->
    <g filter="url(#hyperSpineGlow)">
      <line x1="3" y1="2" x2="9" y2="17" stroke="url(#pGamingLit)" stroke-width="1.9" stroke-linecap="round"/>
      <line x1="9" y1="17" x2="14" y2="24" stroke="url(#pGamingTail)" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="3" y1="2" x2="9" y2="17" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>
      <line x1="9" y1="17" x2="14" y2="24" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/>
    </g>

    <!-- Blinding Diamond Optical Tip at (3, 2) -->
    <circle cx="3" cy="2" r="1.6" fill="#00ffff" filter="url(#hyperSpineGlow)"/>
    <circle cx="3" cy="2" r="1.0" fill="#ffffff"/>
  </g>
</svg>
