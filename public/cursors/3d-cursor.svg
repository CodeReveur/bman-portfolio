<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- 3D Cast Drop Shadow onto the page below -->
    <filter id="shadow3d" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="2.5" dy="3.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Top Lit Facet Gradient (Light from upper-left) -->
    <linearGradient id="litFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Shaded Right Facet Gradient -->
    <linearGradient id="shadeFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 3D Extrusion Side Wall Gradient (Thickness depth) -->
    <linearGradient id="extrudeSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Tail Left Lit Gradient -->
    <linearGradient id="tailLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Tail Right Shaded Gradient -->
    <linearGradient id="tailShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow3d)">
    <!-- 3D Extruded Slab (Volumetric depth walls) -->
    <path d="M3 23.5 L5 25.5 L14.5 28 L17.5 25.5 L14.5 19 L20.5 17.5 L3 2 Z" fill="url(#extrudeSide)" stroke="#09090b" stroke-width="0.5"/>
    <path d="M10.5 19.5 L13 27.5 L17.5 25 L14.5 18 Z" fill="#020617"/>

    <!-- Main 3D Top Surface -->
    <!-- Shaded Right Wing Facet -->
    <polygon points="3,2 18.5,15.5 9,17" fill="url(#shadeFacet)" stroke="#1e293b" stroke-width="0.4"/>

    <!-- Lit Left Wing Facet -->
    <polygon points="3,2 3,22.5 9,17" fill="url(#litFacet)" stroke="#cbd5e1" stroke-width="0.4"/>

    <!-- Tail Stem Right Facet -->
    <polygon points="9,17 16,23.5 13,16" fill="url(#tailShade)" stroke="#0f172a" stroke-width="0.4"/>

    <!-- Tail Stem Left Facet -->
    <polygon points="9,17 12.5,25 16,23.5" fill="url(#tailLit)" stroke="#334155" stroke-width="0.4"/>

    <!-- Razor-sharp 3D Central Ridge Spine Highlight -->
    <line x1="3" y1="2" x2="9" y2="17" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="9" y1="17" x2="14" y2="24.2" stroke="#e2e8f0" stroke-width="0.6" stroke-linecap="round"/>

    <!-- Micro Apex Specular Spark at Tip -->
    <circle cx="3" cy="2" r="0.75" fill="#ffffff"/>
  </g>
</svg>
