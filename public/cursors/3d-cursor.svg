<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Live Chroma Cosmic Animation for Browsers Supporting SVG Animation -->
    <style>
      @keyframes rgbFlow1 {
        0% { stop-color: #00f5ff; }
        25% { stop-color: #a855f7; }
        50% { stop-color: #ff007f; }
        75% { stop-color: #ffb703; }
        100% { stop-color: #00f5ff; }
      }
      @keyframes rgbFlow2 {
        0% { stop-color: #a855f7; }
        25% { stop-color: #ff007f; }
        50% { stop-color: #ffb703; }
        75% { stop-color: #00ffcc; }
        100% { stop-color: #a855f7; }
      }
      @keyframes rgbFlow3 {
        0% { stop-color: #ff007f; }
        25% { stop-color: #ffb703; }
        50% { stop-color: #00f5ff; }
        75% { stop-color: #a855f7; }
        100% { stop-color: #ff007f; }
      }
      .chroma-1 { animation: rgbFlow1 4s linear infinite; }
      .chroma-2 { animation: rgbFlow2 4s linear infinite; }
      .chroma-3 { animation: rgbFlow3 4s linear infinite; }
    </style>

    <!-- 3D Physical Drop Shadow Filter -->
    <filter id="shadow3d" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2.5" dy="3.8" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Gaming Mouse RGB Underglow Radiance Filter -->
    <filter id="rgbUnderglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="glow"/>
    </filter>

    <!-- Center Laser Spine Glow Filter -->
    <filter id="spineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 1. Gaming Mouse Chroma Primary Spectrum (Lit Top-Left 3D Facet) -->
    <linearGradient id="gamingLitFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#00f5ff" class="chroma-1"/>
      <stop offset="45%" stop-color="#a855f7" class="chroma-2"/>
      <stop offset="78%" stop-color="#ff007f" class="chroma-3"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <!-- 2. Gaming Mouse Chroma Shaded Spectrum (Right 3D Facet - Rich Saturated Deep Tones) -->
    <linearGradient id="gamingShadeFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" class="chroma-1"/>
      <stop offset="35%" stop-color="#7c3aed" class="chroma-2"/>
      <stop offset="75%" stop-color="#be185d" class="chroma-3"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- 3. Tail Facets (Supernova Amber to Magenta) -->
    <linearGradient id="gamingTailLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" class="chroma-3"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <linearGradient id="gamingTailShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- 4. 3D Extrusion Depth Wall (Dark Carbon Base with RGB Rim Light) -->
    <linearGradient id="gamingExtrude" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- 5. RGB Underglow Surface Radiance -->
    <linearGradient id="underglowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" class="chroma-1"/>
      <stop offset="40%" stop-color="#a855f7" class="chroma-2"/>
      <stop offset="80%" stop-color="#ff007f" class="chroma-3"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
  </defs>

  <!-- 1. Gaming Mouse Surface RGB Underglow (Cast on the screen below) -->
  <g filter="url(#rgbUnderglow)" opacity="0.9">
    <path d="M4 4 L19 16 L14 18 L16 24 L13 26 L9 18 L4 23 Z" fill="url(#underglowGrad)" transform="translate(1.5, 2.5)"/>
  </g>

  <!-- 2. 3D Gaming Mouse Body with Physical Depth Shadow -->
  <g filter="url(#shadow3d)">
    <!-- 3D Beveled Extrusion Slab (Physical Depth Walls) -->
    <path d="M3 23 L5.5 25.5 L14.5 28 L17.5 25.5 L14.5 19 L20.5 17.5 L3 2 Z" fill="url(#gamingExtrude)" stroke="#09090b" stroke-width="0.5"/>
    <path d="M10.5 19.5 L13 27.5 L17.5 25 L14.5 18 Z" fill="#000000"/>

    <!-- Bottom RGB Undercarriage Light Strip -->
    <path d="M4.5 24.5 L13.5 27 L16.5 25" stroke="url(#underglowGrad)" stroke-width="1.3" fill="none" stroke-linecap="round"/>

    <!-- 3. Primary 3D Facets - Vivid Gaming Mouse Chroma Shell -->
    <!-- Right Shaded 3D Facet -->
    <polygon points="3,2 18.5,15.5 9,17" fill="url(#gamingShadeFacet)" stroke="#020617" stroke-width="0.4"/>

    <!-- Left Lit 3D Facet -->
    <polygon points="3,2 3,22.5 9,17" fill="url(#gamingLitFacet)" stroke="#00f5ff" stroke-width="0.4"/>

    <!-- Tail Stem Right Facet -->
    <polygon points="9,17 16,23.5 13,16" fill="url(#gamingTailShade)" stroke="#020617" stroke-width="0.4"/>

    <!-- Tail Stem Left Facet -->
    <polygon points="9,17 12.5,25 16,23.5" fill="url(#gamingTailLit)" stroke="#ff007f" stroke-width="0.4"/>

    <!-- 4. Outer Gaming Mouse Cyber Contour Trim -->
    <path d="M3 2.5 L3 22" stroke="#00f5ff" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <path d="M3.5 2.5 L18 15" stroke="url(#underglowGrad)" stroke-width="0.9" stroke-linecap="round" fill="none"/>

    <!-- 5. 3D Illuminated Center Spine Channel (Laser Light Strip) -->
    <g filter="url(#spineGlow)">
      <!-- Saturated RGB Core Strip -->
      <line x1="3" y1="2" x2="9" y2="17" stroke="url(#gamingLitFacet)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="9" y1="17" x2="14" y2="24" stroke="url(#gamingTailLit)" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Blinding White Optical Filament -->
      <line x1="3" y1="2" x2="9" y2="17" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/>
      <line x1="9" y1="17" x2="14" y2="24" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round"/>
    </g>

    <!-- 6. Apex Optical DPI Sensor Spark at Tip (3, 2) -->
    <circle cx="3" cy="2" r="1.4" fill="#00f5ff" filter="url(#spineGlow)"/>
    <circle cx="3" cy="2" r="0.8" fill="#ffffff"/>
  </g>
</svg>
